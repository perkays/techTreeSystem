<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selesta-World Tech Tree</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="ui-layer">
      <div class="panel header-panel">
        <h1>Tech Tree Editor</h1>
        <div class="controls">
          <input type="text" id="search-input" placeholder="Search technology..." />
          <div style="display: flex; gap: 8px; align-items: center;">
            <select id="category-filter" title="Filter nach Kategorie">
              <option value="">-- Kategorie wählen --</option>
              <option value="**all**">Alle Technologien</option>
            </select>
            <button id="category-apply-btn" title="Kategorie-Filter anwenden">Übernehmen</button>
          </div>
          <div style="display: flex; gap: 8px; align-items: center;">
            <div style="position: relative; display: flex; align-items: center;">
              <input type="text" list="tech-list" id="focus-input" placeholder="Focus Tech..." title="Show only a specific technology and dependencies" style="padding-right: 32px;" />
              <button id="focus-clear-btn" type="button" title="Focus löschen" style="position: absolute; right: 8px; background: none; border: none; cursor: pointer; font-size: 16px; padding: 0; color: var(--text-muted); display: none;">✕</button>
            </div>
            <datalist id="tech-list"></datalist>
            <button id="focus-apply-btn" title="Focus-Filter anwenden">Übernehmen</button>
          </div>
          <label class="checkbox-label" title="Zeigt nur an, welche Technologien vorher erforscht werden müssen">
            <input type="checkbox" id="focus-prereqs-only" checked />
            Nur Vorgänger
          </label>
          <label class="checkbox-label" title="Nur View-Modus (Mehr Performance, keine Bearbeitung)">
            <input type="checkbox" id="view-mode-toggle" />
            View Mode
          </label>
          <label class="checkbox-label" title="Änderungen am Baum (Positionen, Linien) werden nur gespeichert, wenn aktiviert. Ansonsten lädt das Neuladen den letzten gesicherten Stand.">
            <input type="checkbox" id="auto-save-toggle" />
            Auto-Save
          </label>
          <div style="display: flex; gap: 8px; align-items: center;">
            <select id="worker-filter" title="Filter nach Arbeitergruppe">
              <option value="">-- Alle Arbeitergruppen --</option>
            </select>
            <span id="worker-filter-count" style="font-size: 13px; color: var(--text-muted); min-width: 60px;">0 Techs</span>
          </div>
          <button id="export-btn" style="margin-left:auto;">Export JSON</button>
          <label class="button-label">
            Import JSON
            <input type="file" id="import-btn" accept=".json" style="display: none;" />
          </label>
        </div>
      </div>
      <div class="panel snapshot-panel">
        <select id="snapshot-dropdown"></select>
        <button id="restore-btn">Restore Default</button>
        <button id="delete-snapshot-btn" class="danger-btn">Delete</button>
      </div>
      
      <div id="stats-panel" class="panel stats-panel">
        <div id="global-stats">
          Technologien: <span id="stat-tech-count">0</span><br/>
          Abhängigkeiten: <span id="stat-dep-count">0</span>
        </div>
        <div id="focus-stats" class="hidden">
          <hr />
          Auswahl: <span id="stat-focus-name">-</span><br />
          Zwingend erforderlich: <span id="stat-focus-req">0</span> Tech(s)
        </div>
      </div>
      
      <div id="worker-panel" class="panel worker-panel hidden">
        <h3>Benötigte Arbeitergruppen</h3>
        <div id="worker-cards-container"></div>
      </div>
    </div>
    
    <!-- Confirm Modal -->
    <div id="delete-modal" class="modal hidden">
      <div class="modal-content">
        <h3>Delete Default/Snapshot?</h3>
        <p>Are you sure you want to delete this state permanently?</p>
        <div class="modal-actions">
          <button id="modal-cancel">Cancel</button>
          <button id="modal-confirm" class="danger-btn">Delete</button>
        </div>
      </div>
    </div>

    <div id="workspace-container">
      <div id="workspace">
        <svg id="connections-svg"></svg>
        <div id="nodes-container"></div>
      </div>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
